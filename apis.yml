name: Timberhub
description: 'Timberhub is a European B2B timber trading platform that connects buyers
  with more than 70 sawmills across 28 countries. It offers timber sourcing with 24-hour
  quotes, built-in EUDR (EU Deforestation Regulation) compliance automation, and AI-powered
  workflow automation spanning product matching, logistics, and compliance documentation.
  The company operates a login-gated web application at app.timberhub.com and, as of this
  enrichment pass, publishes no public developer API, developer portal, OpenAPI, or
  machine-readable API documentation. Backed by Creandum, HV Capital, and Speedinvest.'
